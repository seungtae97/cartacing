<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>카트레이싱</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="2000" height="1300" tabindex="0" aria-label="2D 자동차 레이싱 게임"></canvas>

      <section class="menu-panel" id="menuPanel">
        <div class="menu-grid">
          <section class="menu-main">
            <p class="eyebrow">최대 12명 온라인 레이스</p>
            <h1>카트레이싱</h1>
            <label for="nickname">닉네임</label>
            <input id="nickname" maxlength="18" autocomplete="nickname" placeholder="드라이버" />

            <div class="create-box">
              <label for="roomName">새 방 이름</label>
              <input id="roomName" maxlength="24" placeholder="새 레이스 방" />
            <label for="circuitSelect">서킷 선택</label>
            <select id="circuitSelect"></select>
            <p class="help-text">조작: 방향키 또는 WASD로 주행, R 키로 트랙 중앙 리스폰</p>
            <button id="createRoomButton" type="button">방 만들기</button>
            </div>

            <p class="status" id="connectionStatus">서버에 연결 중...</p>
          </section>

          <section class="room-browser">
            <div class="panel-title">
              <h2>공개 방 목록</h2>
              <button id="refreshRoomsButton" type="button">새로고침</button>
            </div>
            <div id="roomList" class="room-list"></div>
          </section>
        </div>
      </section>

      <section class="room-panel hidden" id="roomPanel">
        <div>
          <strong id="roomTitle">방</strong>
          <span id="roomMeta">대기 중</span>
        </div>
        <div id="participantList" class="participant-list"></div>
        <div class="room-actions">
          <button id="readyButton" type="button">준비</button>
          <button id="startButton" type="button">게임 시작</button>
          <button id="leaveButton" type="button">나가기</button>
        </div>
      </section>

      <section class="hud" aria-live="polite">
        <div>
          <span>순위</span>
          <strong id="position">--</strong>
        </div>
        <div>
          <span>랩</span>
          <strong id="lap">--</strong>
        </div>
        <div>
          <span>속도</span>
          <strong id="speed">0</strong>
        </div>
        <div>
          <span>인원</span>
          <strong id="players">0/12</strong>
        </div>
      </section>

      <aside class="leaderboard">
        <div class="leaderboard-header">
          <span>순위표</span>
        </div>
        <ol id="leaderboard"></ol>
      </aside>

      <div class="countdown hidden" id="countdownOverlay"></div>

      <section class="results hidden" id="resultsPanel">
        <div class="results-box">
          <h2>레이스 결과</h2>
          <ol id="results"></ol>
          <button id="backToLobbyButton" type="button">방으로 돌아가기</button>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/client.js"></script>
  </body>
</html>
